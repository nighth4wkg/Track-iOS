# Which views update, and how long each takes, through the motion check (Settings → About, hold Version): a Release
# build runs it by itself (-dryRun -motionCheck) on the demo training in the Simulator under Instruments. Every table
# the template recorded is attached (Time Profiler: the SwiftUI instrument doesn't run in the Simulator).
name: Motion profile
on:
  workflow_dispatch:
    inputs:
      template:
        description: Instruments template
        default: Time Profiler
      args:
        description: Extra launch arguments (AB switches)
        default: ''
  push:
    branches: ['motion-*']
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pick and boot an iPhone
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, list_ in devices.items() if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")]
          phones.sort(key=lambda p: (p[0], "Pro" in p[1]["name"] and "Max" not in p[1]["name"]))
          print(phones[-1][1]["udid"])')
          xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Build (Release)
        run: |
          xcodebuild -project Track.xcodeproj -scheme Track -configuration Release -destination "id=$UDID" -derivedDataPath build \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" -A4 build.log | head -n 100; tail -n 30 build.log; exit 1; }
          echo "APP=$(ls -d build/Build/Products/Release-iphonesimulator/Track.app)" >> "$GITHUB_ENV"
      - name: Profile the motion check
        run: |
          mkdir -p out
          xcrun simctl install "$UDID" "$APP"
          # Launched by xctrace from the app's absolute path (a relative one wasn't found); the check starts 2 s after
          # launch and takes ~90 s, the trace stops a little after.
          xcrun xctrace record --template "${{ inputs.template || 'Time Profiler' }}" --device "$UDID" --time-limit 110s --output out/motion.trace \
            --env TRACK_SEED="$(python3 tools/demo-data.py)" --launch -- "$PWD/$APP" -dryRun -motionCheck ${{ inputs.args }} > out/xctrace.log 2>&1 || true
          cat out/xctrace.log
          # Whether the check ran (its lines in the Simulator's log), and why Track stopped if it crashed.
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'subsystem == "Track"' > out/track.log 2>&1 || true
          grep -c "motion " out/track.log || true; grep "motion done" out/track.log || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i track && head -n 60 ~/Library/Logs/DiagnosticReports/Track* || true
          xcrun xctrace export --input out/motion.trace --toc > out/toc.xml
          for schema in $(grep -o 'schema="[^"]*"' out/toc.xml | cut -d'"' -f2 | sort -u); do
            xcrun xctrace export --input out/motion.trace --xpath "/trace-toc/run[@number=\"1\"]/data/table[@schema=\"$schema\"]" > "out/$schema.xml" || true
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-${{ github.run_number }}
          path: |
            out/*.xml
            out/xctrace.log
            out/track.log
          retention-days: 3
