# The unsigned iPhone app, built on macOS (minutes count 10x, so only when the app or the core's sources change),
# with Track.ipa attached to the run. On main, a new version number is also published as a GitHub Release with
# Track.ipa and source.json, the SideStore/AltStore source, whose fixed link always points at the newest release:
# https://github.com/nighth4wkg/Track-iOS/releases/latest/download/source.json
name: App
on:
  push:
    branches: [main]
    paths: ['App/**', 'Widgets/**', 'Core/Sources/**', 'Core/Package.swift', 'project.yml', '.github/workflows/app.yml']
  workflow_dispatch:
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the earlier release tags, for what changed since the last one
      - name: Use the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project Track.xcodeproj -scheme Track -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 \
            || { grep -E "error:" -A4 build.log | head -n 200; tail -n 40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -n 40 || true
          tail -n 3 build.log
      - name: Package Track.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Track.app Payload/
          zip -qry Track.ipa Payload
          ls -lh Track.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Track-ipa-${{ github.run_number }}
          path: Track.ipa
          retention-days: 14
      - name: Publish a release for SideStore (main, new version only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          plist=Payload/Track.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist")
          build=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$plist")
          tag="v$version-$build"
          if gh release view "$tag" > /dev/null 2>&1; then echo "$tag is already released"; exit 0; fi
          # What's new: each commit since the last release (its first line); on the first release, the version's own
          # commit, the one whose first line starts with the version ("0.18.3 (35): ...", not one merely mentioning it).
          last=$(git tag --list 'v*' --sort=-creatordate | head -n 1)
          { if [ -n "$last" ]; then git log --format='- %s' "$last..HEAD"
            else git log --format='- %s' | grep -F -m 1 -- "- $version ($build)"; fi; } \
            | grep -v -E '^- [0-9]+\.[0-9]+\.[0-9]+ \([0-9]+\)$' > notes.txt || true
          [ -s notes.txt ] || git log -1 --format='- %s' > notes.txt
          VERSION="$version" BUILD="$build" TAG="$tag" SIZE=$(stat -f%z Track.ipa) python3 - <<'PY'
          import json, os, datetime
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          notes = open("notes.txt").read().strip()
          source = {
              "name": "Track",
              "identifier": "com.nighth4wkg.track.source",
              "sourceURL": f"https://github.com/{repo}/releases/latest/download/source.json",
              "subtitle": "A simple personal gym tracker.",
              "tintColor": "#48E58D",
              "apps": [{
                  "name": "Track",
                  "bundleIdentifier": "com.nighth4wkg.track",
                  "developerName": "nighth4wkg",
                  "subtitle": "Your splits, sets and progress.",
                  "localizedDescription": "Track your splits, sets and progress on your iPhone. A personal project, shared as-is.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                  "tintColor": "#48E58D",
                  "versions": [{
                      "version": os.environ["VERSION"],
                      "buildVersion": os.environ["BUILD"],
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": notes,
                      "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/Track.ipa",
                      "size": int(os.environ["SIZE"]),
                      "minOSVersion": "26.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
              "news": [],
          }
          json.dump(source, open("source.json", "w"), indent=2)
          PY
          cat source.json
          gh release create "$tag" Track.ipa source.json --title "Track $version ($build)" --notes-file notes.txt
