# Where the workout's time goes while Next is pressed over and over: Track launched under Time Profiler in the
# Simulator with nothing else touching it (-perfOpen opens a 12-exercise workout, -perfNext walks 40 fields 150 ms
# apart), then the app's main thread summarised by tools/profile-top.py, and each hitch from the app's frame log.
# Then a round of everyday actions (App/PerfDrive.swift, -perfActions), each one's cost from the frame log.
name: Profile
on:
  workflow_dispatch:
  push:
    branches: ['perf-*']
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pick and boot an iPhone
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, list_ in devices.items() if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")]
          phones.sort(key=lambda p: (p[0], "Pro" in p[1]["name"] and "Max" not in p[1]["name"]))
          print(phones[-1][1]["udid"])')
          xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b > /dev/null
          for domain in com.apple.Preferences com.apple.keyboard.preferences; do
            xcrun simctl spawn "$udid" defaults write "$domain" DidShowContinuousPathIntroduction -bool true
          done
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Build and install
        run: |
          xcodebuild -project Track.xcodeproj -scheme Track -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" -A4 build.log | head -n 100; tail -n 30 build.log; exit 1; }
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Track.app
      - name: Profile Next pressed over and over
        run: |
          mkdir -p out
          seed="$(python3 tools/demo-data.py | python3 tools/perf-seed.py)"
          xcrun xctrace record --template 'Time Profiler' --device "$UDID" --time-limit 35s --output out/next.trace \
            --env "TRACK_SEED=$seed" --launch -- build/Build/Products/Debug-iphonesimulator/Track.app \
            -track.storageMode local -frameLog -perfOpen -perfNext > xctrace.log 2>&1 || { cat xctrace.log; exit 1; }
          xcrun xctrace export --input out/next.trace --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' > out/time-profile.xml
          python3 tools/profile-top.py out/time-profile.xml Track
          echo "-- hitches from the frame log --"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'subsystem == "Track"' | tail -n 60
      - name: Profile everyday actions
        run: |
          seed="$(python3 tools/demo-data.py | python3 tools/perf-seed.py)"
          xcrun xctrace record --template 'Time Profiler' --device "$UDID" --time-limit 75s --output out/actions.trace             --env "TRACK_SEED=$seed" --launch -- build/Build/Products/Debug-iphonesimulator/Track.app             -track.storageMode local -frameLog -perfActions > xctrace.log 2>&1 || { cat xctrace.log; exit 1; }
          xcrun xctrace export --input out/actions.trace --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' > out/actions.xml
          python3 tools/profile-top.py out/actions.xml Track
          echo "-- each action, from the frame log --"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'subsystem == "Track" AND category == "actions"' | grep action
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ github.run_number }}
          path: out/*.trace
          retention-days: 3
