# Where the time goes while scrolling: UITests/ScrollProfile drags the workout page, then the exercise list, 20 s
# each with 4 s still around each, while Time Profiler watches Track in the Simulator. The main thread's samples
# (out/time-profile.xml) and the test's frames and hitches (test.log) are attached to the run.
name: Profile
on:
  workflow_dispatch:
    inputs:
      template:
        description: Instruments template ('Time Profiler', or 'SwiftUI' for which views update)
        default: Time Profiler
  push:
    branches: ['perf-*']
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pick and boot an iPhone
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, list_ in devices.items() if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")]
          phones.sort(key=lambda p: (p[0], "Pro" in p[1]["name"] and "Max" not in p[1]["name"]))
          print(phones[-1][1]["udid"])')
          xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b > /dev/null
          for domain in com.apple.Preferences com.apple.keyboard.preferences; do
            xcrun simctl spawn "$udid" defaults write "$domain" DidShowContinuousPathIntroduction -bool true
          done
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          xcodebuild -project Track.xcodeproj -scheme Track -destination "id=$UDID" -derivedDataPath build             CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1 || { grep -E "error:" -A4 build.log | head -n 100; tail -n 30 build.log; exit 1; }
      - name: Profile the scrolls
        run: |
          mkdir -p out
          export TEST_RUNNER_TRACK_SEED="$(python3 tools/demo-data.py)"
          # Track's own process only (a whole-simulator trace took over 13 min to save). Its command line carries the test's
          # launch arguments, so the match allows them.
          xcodebuild -project Track.xcodeproj -scheme Track -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -only-testing:TrackUITests/ScrollProfile/testExerciseListScroll test-without-building > out/test.log 2>&1 &
          test=$!
          pid=""
          for i in $(seq 1 600); do pid=$(pgrep -f 'Track\.app/Track( |$)' | head -n 1); [ -n "$pid" ] && break; kill -0 $test 2>/dev/null || break; sleep 0.5; done
          [ -n "$pid" ] || { echo "Track never started"; ps -ax | grep -i track | head; tail -n 40 out/test.log; exit 1; }
          echo "Track is process $pid"
          xcrun xctrace record --template "${{ inputs.template || 'Time Profiler' }}" --device "$UDID" --attach "$pid" --time-limit 200s --output out/scroll.trace > out/xctrace.log 2>&1 &
          trace=$!
          set +e
          wait $test; status=$?
          kill -INT $trace 2>/dev/null; wait $trace
          set -e
          cat out/xctrace.log
          grep -E "Test Case|error:|PERF|failed|passed" out/test.log | tail -n 40
          # Every table the template recorded, one file each (time-profile.xml is Time Profiler's samples).
          xcrun xctrace export --input out/scroll.trace --toc > out/toc.xml
          for schema in $(grep -o 'schema="[^"]*"' out/toc.xml | cut -d'"' -f2 | sort -u); do
            xcrun xctrace export --input out/scroll.trace --xpath "/trace-toc/run[@number=\"1\"]/data/table[@schema=\"$schema\"]" > "out/$schema.xml" || true
          done
          ls -la out
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ github.run_number }}
          path: |
            out/*.xml
            out/test.log
            out/xctrace.log
          retention-days: 3
