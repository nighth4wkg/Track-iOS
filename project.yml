# The Xcode project, described as text: XcodeGen turns this into Track.xcodeproj on the build machine, so the project
# never has to be edited in Xcode (there is no Mac here). The app depends on Core (TrackCore), the data and logic.
name: Track
options:
  bundleIdPrefix: com.nighth4wkg
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  TrackCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.18.9"
    CURRENT_PROJECT_VERSION: "41"
targets:
  Track:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: TrackCore
      - target: TrackWidgets
    scheme:
      testTargets: [TrackUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Track
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # track://workout: the rest Live Activity opens the workout.
        CFBundleURLTypes:
          - CFBundleURLName: com.nighth4wkg.track
            CFBundleURLSchemes: [track]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nighth4wkg.track
        # iPhone only for now (iPads run it as an iPhone app): no iPad layout has been tested.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Built unsigned; Sideloadly signs it with the person's own Apple ID when installing.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  # The rest timer's Live Activity (Dynamic Island, Lock Screen), embedded in the app.
  TrackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - App/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Track
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nighth4wkg.track.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  # Taps through the app in the Simulator (.github/workflows/uitests.yml).
  TrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Track
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nighth4wkg.track.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Track
        CODE_SIGNING_ALLOWED: NO
